version: 2
updates:
  # Workflow actions are pinned to commit SHAs with a `# vX.Y.Z` comment;
  # Dependabot bumps both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # Minor and patch updates in one PR; a new major version gets its own PR.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  # Base images in the Dockerfile (rust build image, distroless runtime), pinned by
  # digest. Bumping the rust image also means bumping RUST_TOOLCHAIN in ci.yml.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: docker

  # Servers and targets in docker-compose.test.yml, pinned to exact builds (the preview by
  # digest; Dependabot refreshes the digest). Patch updates only: moving to another line (a new
  # LTS, GA or pre-release) is a policy change made by hand (README "Supported servers").
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-compose:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: test
