[package]
name = "lazy-wire-fire"
version = "0.2.2"
edition = "2021"
description = "Change-triggered actions from the MySQL binlog: rows change, keys are marked, queries render one action per batch and fire it at HTTP, S3, queue, stream, mail, Redis or SQL targets"
license = "MIT"
publish = false

[lib]
name = "lazy_wire_fire"
path = "src/lib.rs"

[[bin]]
name = "lazywf"
path = "src/main.rs"

[features]
# Integer key sets (src/intset.rs) use roaring bitmaps instead of a hash set. Off by default.
roaring = ["dep:roaring"]

[dependencies]
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12", "binlog"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "net", "io-util", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std", "logging"] }
webpki-roots = "1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
anyhow = "1"
thiserror = "2"
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
handlebars = "6"
regex = "1"
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
base64 = "0.23"
# Google credentials for the pubsub kind. Default features off: they pull aws-lc and cmake.
google-cloud-auth = { version = "1.18", default-features = false }
httparse = "1"
indexmap = "2"
foldhash = "0.2"
roaring = { version = "0.12", optional = true }
sqlparser = { version = "0.63", features = ["visitor"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
lapin = { version = "4.12", default-features = false, features = ["tokio", "rustls--ring", "rustls-webpki-roots-certs"] }
# SMTP (src/smtp.rs). Default features off: they pull native-tls (OpenSSL); the rustls backend
# is ring only, as the rest of the TLS here. `tracing` on: its debug events echo the SMTP
# commands (the AUTH line carries the credentials), so the CAPPED filter of `logging.rs`
# holds the target at `info`.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "hostname", "tracing"] }
# Kafka produce for the kafka kind (src/kafka.rs). Pure Rust: no librdkafka, no cmake; the TLS
# and the ring crypto are the crate's; the compression codecs the features select (the zstd and
# lz4 ones are the C ones, built with cc / zig as with every other C dependency here).
rskafka = { version = "0.6", default-features = false, features = [
    "compression-gzip",
    "compression-lz4",
    "compression-zstd",
    "transport-tls",
] }
# RabbitMQ Streams for the `rabbitmq-stream` kind (src/rabbitmq_stream.rs): the official
# RabbitMQ stream client, used through its raw `Client` only (its high-level Producer has a
# hardcoded 1 s confirm timeout and `todo!()`s on answers it does not expect). Its tokio-rustls
# comes with the crate's default features, so aws-lc-rs / aws-lc-sys are in the tree (the owner
# accepted both crypto libraries on 2026-11-11; openssl stays out). lazywf installs the ring
# provider as the process default (src/main.rs), so every handshake, this client's included,
# runs on ring: aws-lc is compiled, never used.
rabbitmq-stream-client = "0.11"
# The super stream partition hash of the `rabbitmq-stream` kind (src/rabbitmq_stream.rs): the
# same crate the stream client itself hashes with (`superstream.rs`, seed 104729), so the two
# place a key on the same partition stream. Already in the tree through that client.
murmur3 = "0.5"
# gRPC (src/grpc/): dynamic protobuf messages from a descriptor set, so a schema is
# configuration: no codegen and no protoc at build time. prost-reflect brings prost and
# prost-types (the same prost 0.14 both use).
prost = "0.14"
prost-reflect = "0.16"
# The xxh3-64 content hash of each item, echoed by its ack (src/grpc/). Pure Rust; already
# in the tree through rskafka.
twox-hash = { version = "2.1", default-features = false, features = ["std", "xxhash3_64"] }
# AMQP 1.0 client for the `servicebus` kind (src/servicebus.rs). Pure Rust; the 0.14 line, whose
# rustls feature wires rustls/tokio-rustls with default-features off and the ring provider, as the
# rest of the TLS here (the newer 0.18 line enables rustls' default features, which pull
# aws-lc-rs and cmake). The `rustls` feature is the TLS; CBS (claims-based security) is built on
# the bare link primitives here, in src/servicebus.rs.
fe2o3-amqp = { version = "0.14", default-features = false, features = ["rustls"] }
# The gRPC call itself (src/grpc/stream.rs): tonic's generic client over the hyper/rustls
# transport. Default features off; `channel` is the client half of the transport. TLS goes
# through a connector on src/tls.rs (so lazywf's CA, verify mode and server name apply, and
# ring stays the only libcrypto here): tonic's own tls-* stay unneeded. `gzip` and `zstd`
# are for reading a server that compresses its answers; lazywf's own compression is applied
# per message above the size threshold (see stream.rs).
tonic = { version = "0.14", default-features = false, features = [
    "channel",
    "gzip",
    "zstd",
] }
# The prost codec for the static contract types (Envelope out, Acks in).
tonic-prost = { version = "0.14", default-features = false }
# The wire pieces the compression service between the gRPC layer and the channel speaks:
# the framed bodies, the two codecs, and the hyper glue for the connector on src/tls.rs.
# Same versions the rest of the tree builds on (hyper, lapin, rskafka).
bytes = "1"
http = "1"
http-body = "1"
# The body combinators: the compression service collects response excerpts and
# the tests read framed bodies back.
http-body-util = "0.1"
tower-service = "0.3"
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tokio-stream = "0.1"
flate2 = "1"
zstd = { version = "0.14", default-features = false }
# Tests only: the gRPC e2e (tests/grpc_stream.rs) answers with a hand-rolled h2
# server, so it can reply plain HTTP statuses, drop trailers and reset streams
# mid-call, none of which a real gRPC framework server lets you do.
h2 = "0.4"
# AWS credentials and SigV4 (src/aws.rs). Default features off: aws-config's defaults bring
# aws-lc and cmake; the HTTP client is the rustls-ring one, passed in.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
aws-credential-types = "1"
aws-sigv4 = { version = "1", default-features = false, features = ["sign-http"] }
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }
aws-smithy-runtime-api = "1"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
# Tests only: a receiver for the `yaml` helper's bodies (the tool itself never parses YAML).
# The YAML organization's maintained serde_yaml successor; pure Rust (libyaml-rs), no C build.
yaml_serde = "0.10"
# Tests only: compiles a .proto with no protoc (pure Rust), so the tests build the descriptor
# sets they need and check the one shipped for lazywf's own contract against its .proto.
protox = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
