[package]
name = "lazy-wire-fire"
version = "0.1.0"
edition = "2021"
description = "Change-triggered actions from the MySQL binlog: rows change, keys are marked, queries render one action per batch and fire it at HTTP, Redis or SQL targets"
license = "MIT"
publish = false

[lib]
name = "lazy_wire_fire"
path = "src/lib.rs"

[[bin]]
name = "lazywf"
path = "src/main.rs"

[dependencies]
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12", "binlog"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "net", "io-util", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std", "logging"] }
webpki-roots = "1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
anyhow = "1"
thiserror = "2"
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
handlebars = "6"
regex = "1"
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
httparse = "1"
indexmap = "2"
roaring = "0.11"
sqlparser = { version = "0.63", features = ["visitor"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }

[dev-dependencies]
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
