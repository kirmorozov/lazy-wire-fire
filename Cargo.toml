[package]
name = "lazy-wire-fire"
version = "0.2.2"
edition = "2021"
description = "Change-triggered actions from the MySQL binlog: rows change, keys are marked, queries render one action per batch and fire it at HTTP, S3, queue, stream, mail, Redis or SQL targets"
license = "MIT"
publish = false

[lib]
name = "lazy_wire_fire"
path = "src/lib.rs"

[[bin]]
name = "lazywf"
path = "src/main.rs"

[features]
# Integer key sets (src/intset.rs) use roaring bitmaps instead of a hash set. Off by default.
roaring = ["dep:roaring"]

[dependencies]
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12", "binlog"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "net", "io-util", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std", "logging"] }
webpki-roots = "1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
anyhow = "1"
thiserror = "2"
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
handlebars = "6"
regex = "1"
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
base64 = "0.23"
# Google credentials for the pubsub kind. Default features off: they pull aws-lc and cmake.
google-cloud-auth = { version = "1.18", default-features = false }
httparse = "1"
indexmap = "2"
foldhash = "0.2"
roaring = { version = "0.12", optional = true }
sqlparser = { version = "0.63", features = ["visitor"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
lapin = { version = "4.12", default-features = false, features = ["tokio", "rustls--ring", "rustls-webpki-roots-certs"] }
# SMTP (src/smtp.rs). Default features off: they pull native-tls (OpenSSL); the rustls backend
# is ring only, as the rest of the TLS here. `tracing` on: its debug events echo the SMTP
# commands (the AUTH line carries the credentials), so the CAPPED filter of `logging.rs`
# holds the target at `info`.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "hostname", "tracing"] }
# Kafka produce for the kafka kind (src/kafka.rs). Pure Rust: no librdkafka, no cmake; the TLS
# and the ring crypto are the crate's; the compression codecs the features select (the zstd and
# lz4 ones are the C ones, built with cc / zig as with every other C dependency here).
rskafka = { version = "0.6", default-features = false, features = [
    "compression-gzip",
    "compression-lz4",
    "compression-zstd",
    "transport-tls",
] }
# NATS JetStream publish for the nats kind (src/nats.rs). Default features off: they select
# rustls with the aws-lc provider, which builds with cmake. `ring` is the crypto backend, as for
# every other TLS here, and `nkeys` the ed25519 signer for the NATS account authentication
# (`nkey:` + `jwt:`); both are pure Rust.
async-nats = { version = "0.52", default-features = false, features = ["ring", "jetstream", "nkeys"] }
nkeys = "0.4"
# AWS credentials and SigV4 (src/aws.rs). Default features off: aws-config's defaults bring
# aws-lc and cmake; the HTTP client is the rustls-ring one, passed in.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
aws-credential-types = "1"
aws-sigv4 = { version = "1", default-features = false, features = ["sign-http"] }
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }
aws-smithy-runtime-api = "1"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
# Tests only: a receiver for the `yaml` helper's bodies (the tool itself never parses YAML).
# The YAML organization's maintained serde_yaml successor; pure Rust (libyaml-rs), no C build.
yaml_serde = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
