# Servers for the integration tests (tests/e2e.rs). Ports bind to 127.0.0.1 only. Every image is
# pinned to an exact build (the preview by digest); Dependabot proposes patch bumps. Which lines
# are tested and why: README "Supported servers".
#
#   make servers             # the default set: MySQL 8.4, MariaDB 10.11 and the targets
#   make test-e2e-all        # the integration tests on both
#   make test-matrix         # every other required line (profile `matrix`), one at a time
#   make test-prerelease     # the advisory MariaDB RC and preview (profile `prerelease`)
#   docker compose -f docker-compose.test.yml --profile search up -d --wait    # + OpenSearch, Elasticsearch 8 / 7
#   docker compose -f docker-compose.test.yml --profile varnish up -d --wait   # + Varnish (host network)
#   docker compose -f docker-compose.test.yml --profile amqp up -d --wait      # + RabbitMQ (the amqp target tests)
#   docker compose -f docker-compose.test.yml --profile smtp up -d --wait      # + Mailpit (the smtp target tests)
#   docker compose -f docker-compose.test.yml --profile kafka up -d --wait     # + Redpanda (the kafka target tests, host network)
#   make servers-down        # every profile, volumes included
#
# MySQL and Percona run with GTIDs on except MySQL 8.0 (off, as in RDS for MySQL's default
# parameter group), MariaDB with its own (always on). Host ports: 341xx for
# MySQL and MariaDB (34180 = 8.0, 34106 = 10.6, ...), 342xx for Percona and MySQL 26.x.
name: lazywf-test

services:
  mysql84:
    image: mysql:8.4.13
    command: ["--server-id=1", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--log-bin=binlog",
              "--max-connections=500", "--innodb-buffer-pool-size=128M", "--performance-schema=OFF"]
    environment: { MYSQL_ROOT_PASSWORD: root }
    ports: ["127.0.0.1:34184:3306"]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h127.0.0.1", "-uroot", "-proot", "--silent"], interval: 2s, retries: 60 }

  mariadb1011:
    image: mariadb:10.11.19
    command: ["--server-id=1", "--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL",
              "--max-connections=500", "--innodb-buffer-pool-size=128M"]
    environment: { MARIADB_ROOT_PASSWORD: root }
    ports: ["127.0.0.1:34111:3306"]
    healthcheck: { test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"], interval: 2s, retries: 60 }

  redis:
    image: redis:7.4.12-alpine
    command: ["redis-server", "--requirepass", "redispw", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:34379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "-a", "redispw", "ping"], interval: 2s, retries: 30 }

  valkey:
    image: valkey/valkey:8.1.11-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no",
              "--user", "default", "off", "--user", "lazywf", "on", ">valkeypw", "~*", "&*", "+@all"]
    ports: ["127.0.0.1:34380:6379"]

  postgres:
    image: postgres:17.11-alpine
    environment: { POSTGRES_PASSWORD: pgpw, POSTGRES_DB: sink }
    ports: ["127.0.0.1:34432:5432"]
    healthcheck: { test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"], interval: 2s, retries: 30 }

  s3:
    image: versity/versitygw:v1.10.0
    command: ["--port", ":7070", "posix", "--nometa", "/data"]
    environment: { ROOT_ACCESS_KEY: lazywfaccess, ROOT_SECRET_KEY: lazywfsecret }
    tmpfs: ["/data"]
    ports: ["127.0.0.1:34070:7070"]

  # The SQS API for the `sqs` target tests (ElasticMQ, native build). Not started by `make
  # servers`: `docker compose -f docker-compose.test.yml --profile sqs up -d --wait elasticmq`.
  elasticmq:
    image: softwaremill/elasticmq-native:1.6.12
    profiles: ["sqs"]
    ports: ["127.0.0.1:34561:9324"]

  # The Kinesis API for the `kinesis` target tests (kinesis-mock, JVM). Not started by `make
  # servers`: `docker compose -f docker-compose.test.yml --profile kinesis up -d --wait kinesis-mock`.
  # Plain HTTP on 4568 (4567 is TLS; it does not check signatures); the tests create their own streams.
  kinesis-mock:
    image: ghcr.io/etspaceman/kinesis-mock:0.2.2@sha256:23c2ff9b225e74fdb52cb426352130e74a65445b3d4b1391f0cf566ab8336d8f
    profiles: ["kinesis"]
    ports: ["127.0.0.1:34562:4568"]

  # The AMQP broker for the `amqp` target tests (RabbitMQ 4.x, AMQP 0-9-1). Not started by `make
  # servers`: `docker compose -f docker-compose.test.yml --profile amqp up -d --wait rabbitmq`.
  rabbitmq:
    image: rabbitmq:4.3.7
    profiles: ["amqp"]
    environment: { RABBITMQ_DEFAULT_USER: lwftest, RABBITMQ_DEFAULT_PASS: lwftest }
    ports: ["127.0.0.1:34560:5672"]
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 3s, retries: 60 }

  # Mailpit for the `smtp` target tests (SMTP on 1025, its HTTP API on 8025). Not started by
  # `make servers`: `docker compose -f docker-compose.test.yml --profile smtp up -d --wait mailpit`.
  # AUTH takes any credentials (the log_secrets flow); anonymous sends still work. The recipient
  # allow-list (a 550 on the rest) is what the refusal test addresses against.
  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    profiles: ["smtp"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_SMTP_ALLOWED_RECIPIENTS: "^lwf-smtp-.*@lwf-smtp\\.test$"
    ports: ["127.0.0.1:34565:1025", "127.0.0.1:34566:8025"]

  # Google's Pub/Sub emulator for the `pubsub` target tests (Google Cloud SDK `emulators` image,
  # pinned by digest; ~1.1 GB). Not started by `make servers`: `docker compose -f
  # docker-compose.test.yml --profile pubsub up -d --wait pubsub-emulator`. REST and gRPC on 8085.
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:c3b114528245d315af73d92d95d8e2fed9747ce29003ad46232f22b4542da036
    profiles: ["pubsub"]
    command: ["gcloud", "beta", "emulators", "pubsub", "start", "--host-port=0.0.0.0:8085", "--project=lwf-test"]
    ports: ["127.0.0.1:34563:8085"]

  # The Kafka-protocol broker for the `kafka` target tests (Redpanda, a single node, pinned by
  # manifest digest; one core, ~174 MiB, ready in ~10 s). Not started by `make servers`:
  # `docker compose -f docker-compose.test.yml --profile kafka up -d --wait kafka`. Host network
  # (the varnish precedent): its advertised address is 127.0.0.1, which both the host's clients
  # and its own rpk reach; the baked-in configuration binds 0.0.0.0:9092/9644/33145, which a
  # shared host must not keep. Kafka on 34564, the admin API on 34567, the RPC on 34568: 34565
  # and 34566 are Mailpit's (the `smtp` service), and `make test-e2e-queues` runs both.
  kafka:
    image: redpandadata/redpanda:v26.1.20@sha256:8c94f3135dcb94736744aea8fae1ca46c46c7d26ad219cb2e2c10defbe884872
    profiles: ["kafka"]
    network_mode: host
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |-
        rpk redpanda config set redpanda.kafka_api "[{\"address\":\"127.0.0.1\",\"port\":34564}]" && \
        rpk redpanda config set redpanda.advertised_kafka_api "[{\"address\":\"127.0.0.1\",\"port\":34564}]" && \
        rpk redpanda config set redpanda.admin "[{\"address\":\"127.0.0.1\",\"port\":34567}]" && \
        rpk redpanda config set redpanda.rpc_server "{\"address\":\"127.0.0.1\",\"port\":34568}" && \
        rpk redpanda config set redpanda.advertised_rpc_api "{\"address\":\"127.0.0.1\",\"port\":34568}" && \
        exec redpanda --redpanda-cfg /etc/redpanda/redpanda.yaml --smp 1 --memory 1G --overprovisioned --unsafe-bypass-fsync=true
    healthcheck: { test: ["CMD-SHELL", "curl -sf http://127.0.0.1:34567/v1/status/ready || exit 1"], interval: 2s, retries: 60 }

  opensearch:
    image: opensearchproject/opensearch:2.19.7
    profiles: ["search"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["127.0.0.1:34200:9200"]
    healthcheck: { test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"], interval: 3s, retries: 60 }

  # Security and HTTPS on (auto-configured on first start): basic auth, a private CA.
  es8:
    image: elasticsearch:8.17.10
    profiles: ["search"]
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: elasticpw
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.ml.enabled: "false"
      # A CI runner's disk is routinely >90% used (build caches, engine images). With 8.x's default
      # watermarks, a node with <10% of the disk free refuses to allocate new primaries, so the test's
      # index leaves the cluster RED and its writes hang until the client timeout (CI runs
      # 41748509714 / 42042716686). The test holds a few MB, so absolute thresholds that still hold
      # on a nearly-full runner:
      cluster.routing.allocation.disk.watermark.low: "2g"
      cluster.routing.allocation.disk.watermark.high: "1g"
      cluster.routing.allocation.disk.watermark.flood_stage: "500m"
    ports: ["127.0.0.1:34202:9200"]
    healthcheck: { test: ["CMD-SHELL", "curl -sfk -u elastic:elasticpw https://localhost:9200/_cluster/health || exit 1"], interval: 3s, retries: 80 }

  es7:
    image: elasticsearch:7.17.28
    profiles: ["search"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.ml.enabled: "false"
    ports: ["127.0.0.1:34207:9200"]
    healthcheck: { test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"], interval: 3s, retries: 80 }

  # Listens on 127.0.0.1:34681 only; its backend is the test's HTTP server on 127.0.0.1:34682.
  # varnishd as the first argument: with flags only, the image's entrypoint also binds :80 and
  # :8443 on the host network (refused for its unprivileged user on a stock Linux host).
  varnish:
    image: varnish:7.6.5
    profiles: ["varnish"]
    network_mode: host
    command: ["varnishd", "-F", "-a", "127.0.0.1:34681", "-f", "/etc/varnish/default.vcl", "-s", "malloc,64m"]
    volumes: ["./docker/varnish/default.vcl:/etc/varnish/default.vcl:ro"]

  # ---- profile `matrix`: every other required line (make test-matrix, one at a time) -------
  # MySQL 8.0 is community EOL (final 8.0.46) but Amazon RDS (Extended Support until 2029-07-31)
  # and Aurora MySQL 3 still run it. GTIDs off, as in RDS for MySQL's default parameter group: the
  # one MySQL server that tests the file/position path and the LAZYWF_VISIBILITY_DELAY_MS fence.
  mysql80:
    image: mysql:8.0.46
    profiles: ["matrix"]
    command: ["--server-id=1", "--log-bin=binlog", "--binlog-row-metadata=FULL", "--max-connections=500",
              "--innodb-buffer-pool-size=128M", "--performance-schema=OFF"]
    environment: { MYSQL_ROOT_PASSWORD: root }
    ports: ["127.0.0.1:34180:3306"]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h127.0.0.1", "-uroot", "-proot", "--silent"], interval: 2s, retries: 60 }

  mysql97:
    image: mysql:9.7.4
    profiles: ["matrix"]
    command: ["--server-id=1", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--log-bin=binlog",
              "--max-connections=500", "--innodb-buffer-pool-size=128M", "--performance-schema=OFF"]
    environment: { MYSQL_ROOT_PASSWORD: root }
    ports: ["127.0.0.1:34197:3306"]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h127.0.0.1", "-uroot", "-proot", "--silent"], interval: 2s, retries: 60 }

  mysql2610:
    image: mysql:26.10.0
    profiles: ["matrix"]
    command: ["--server-id=1", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--log-bin=binlog",
              "--max-connections=500", "--innodb-buffer-pool-size=128M", "--performance-schema=OFF"]
    environment: { MYSQL_ROOT_PASSWORD: root }
    ports: ["127.0.0.1:34210:3306"]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h127.0.0.1", "-uroot", "-proot", "--silent"], interval: 2s, retries: 60 }

  percona84:
    image: percona/percona-server:8.4.11-11
    profiles: ["matrix"]
    command: ["--server-id=1", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--log-bin=binlog",
              "--max-connections=500", "--innodb-buffer-pool-size=128M", "--performance-schema=OFF"]
    environment: { MYSQL_ROOT_PASSWORD: root }
    ports: ["127.0.0.1:34284:3306"]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h127.0.0.1", "-uroot", "-proot", "--silent"], interval: 2s, retries: 60 }

  percona97:
    image: percona/percona-server:9.7.2-2
    profiles: ["matrix"]
    command: ["--server-id=1", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--log-bin=binlog",
              "--max-connections=500", "--innodb-buffer-pool-size=128M", "--performance-schema=OFF"]
    environment: { MYSQL_ROOT_PASSWORD: root }
    ports: ["127.0.0.1:34297:3306"]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h127.0.0.1", "-uroot", "-proot", "--silent"], interval: 2s, retries: 60 }

  # Community EOL (final 10.6.28); required while RDS for MariaDB 10.6 has standard support.
  # Drop it after 2026-12-31 (here, Makefile MATRIX, ci.yml, README).
  mariadb106:
    image: mariadb:10.6.28
    profiles: ["matrix"]
    command: ["--server-id=1", "--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL",
              "--max-connections=500", "--innodb-buffer-pool-size=128M"]
    environment: { MARIADB_ROOT_PASSWORD: root }
    ports: ["127.0.0.1:34106:3306"]
    healthcheck: { test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"], interval: 2s, retries: 60 }

  mariadb114:
    image: mariadb:11.4.13
    profiles: ["matrix"]
    command: ["--server-id=1", "--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL",
              "--max-connections=500", "--innodb-buffer-pool-size=128M"]
    environment: { MARIADB_ROOT_PASSWORD: root }
    ports: ["127.0.0.1:34114:3306"]
    healthcheck: { test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"], interval: 2s, retries: 60 }

  mariadb118:
    image: mariadb:11.8.9
    profiles: ["matrix"]
    command: ["--server-id=1", "--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL",
              "--max-connections=500", "--innodb-buffer-pool-size=128M"]
    environment: { MARIADB_ROOT_PASSWORD: root }
    ports: ["127.0.0.1:34118:3306"]
    healthcheck: { test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"], interval: 2s, retries: 60 }

  mariadb123:
    image: mariadb:12.3.3
    profiles: ["matrix"]
    command: ["--server-id=1", "--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL",
              "--max-connections=500", "--innodb-buffer-pool-size=128M"]
    environment: { MARIADB_ROOT_PASSWORD: root }
    ports: ["127.0.0.1:34123:3306"]
    healthcheck: { test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"], interval: 2s, retries: 60 }

  mariadb130:
    image: mariadb:13.0.2
    profiles: ["matrix"]
    command: ["--server-id=1", "--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL",
              "--max-connections=500", "--innodb-buffer-pool-size=128M"]
    environment: { MARIADB_ROOT_PASSWORD: root }
    ports: ["127.0.0.1:34130:3306"]
    healthcheck: { test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"], interval: 2s, retries: 60 }

  # ---- profile `prerelease`: advisory, never required (make test-prerelease) ----------------
  # MySQL and Percona publish no pre-release image (MySQL early access ships as downloads only).
  mariadb131-rc:
    image: mariadb:13.1.1-rc@sha256:99205f09d838b6dcb37de2b1d672d1fbb1f42040bf8fb5d0c5b6998d00cfa360
    profiles: ["prerelease"]
    command: ["--server-id=1", "--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL",
              "--max-connections=500", "--innodb-buffer-pool-size=128M"]
    environment: { MARIADB_ROOT_PASSWORD: root }
    ports: ["127.0.0.1:34131:3306"]
    healthcheck: { test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"], interval: 2s, retries: 60 }

  # MariaDB 13.2 Preview: no Docker Hub image; the MariaDB Foundation's devel image, pinned by
  # digest (the tag moves). Its my.cnf puts the socket and pid file under /run/mariadbd, which the
  # image does not create, and its data directory /var/lib/mariadb (renamed in 13.2) ships
  # pre-initialized, so the entrypoint would skip the first-start setup (root password). Use the
  # paths the other images use, and a TCP health check (only the real server listens on TCP).
  mariadb132-pre:
    image: quay.io/mariadb-foundation/mariadb-devel:13.2-preview@sha256:b065780c004aa1031ec674444d47667530c025c17d27b9ed35750b0394d7b6bb
    profiles: ["prerelease"]
    command: ["--server-id=1", "--socket=/run/mysqld/mysqld.sock", "--pid-file=/run/mysqld/mysqld.pid",
              "--datadir=/var/lib/mysql", "--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL",
              "--max-connections=500", "--innodb-buffer-pool-size=128M"]
    environment: { MARIADB_ROOT_PASSWORD: root }
    ports: ["127.0.0.1:34132:3306"]
    healthcheck: { test: ["CMD", "mariadb", "--protocol=TCP", "-h127.0.0.1", "-uroot", "-proot", "-e", "SELECT 1"], interval: 2s, retries: 60 }
